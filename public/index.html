<html>

<head>
  <title>Express</title>
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div class="container">
    <h1>麥香紅茶價格追蹤網</h1>
    <p style="text-align: center;">歡迎使用 Express 物價紀錄工具</p>

    <form id="product-form">
      <div>
        <label for="date">日期:</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div>
        <label for="product_name">產品名稱:</label>
        <input type="text" id="product_name" name="product_name" placeholder="請輸入產品名稱" required>
      </div>
      <div>
        <label for="price">產品價格:</label>
        <input type="number" id="price" name="price" step="0.01" placeholder="0.00" required>
      </div>
      <button type="submit">提交紀錄</button>
    </form>

    <p id="response-message"></p>
  </div>

  <hr>

  <div class="container">
    <h2>查詢與產品資料表</h2>
    <div class="search-box">
      <label for="search-input">搜尋年份:</label>
      <input type="text" id="search-input" placeholder="輸入年份 (例如: 2025) 來過濾..." oninput="filterTable()">
    </div>
    
    <table id="product-table">
      <thead>
        <tr>
          <th>日期</th>
          <th>產品名稱</th>
          <th>價格</th>
        </tr>
      </thead>
      <tbody>
        <!-- 資料將插入於此 -->
      </tbody>
    </table>
  </div>

  <div class="container">
    <h2>價格趨勢圖</h2>
    <canvas id="priceChart" width="400" height="200"></canvas>
  </div>

  <div class="container" id="prediction-section">
    <h2>未來價格預測 (參考報導數據)</h2>
    <div id="prediction-content">
      <p>根據報導數據分析：</p>
      <ul>
        <li>特定產品漲幅預期：<strong>+47%</strong> (17元 → 25元)</li>
        <li>麥香紅茶 (480ml) 漲幅預期：<strong>+25%</strong> (16元 → 20元)</li>
      </ul>
      <p id="prediction-result">請先提交或載入數據以查看預測值。</p>
    </div>
  </div>

  <script>
    let allProducts = []; // 儲存所有從 API 取得的資料
    let priceChart; // 儲存圖表實例

    // 取得資料並渲染表格的函式
    async function loadProducts() {
      const tableBody = document.querySelector('#product-table tbody');
      try {
        const response = await fetch('/api/quotes');
        allProducts = await response.json();
        
        renderTable(allProducts);
        updateChart(allProducts);
        calculatePrediction(allProducts);
      } catch (error) {
        console.error('Error fetching quotes:', error);
      }
    }

    // 渲染表格的函式
    function renderTable(data) {
      const tableBody = document.querySelector('#product-table tbody');
      tableBody.innerHTML = '';

      data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.date}</td>
          <td>${item.product_name}</td>
          <td>${item.price}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // 查詢邏輯：根據年份過濾
    function filterTable() {
      const year = document.getElementById('search-input').value.trim();
      if (!year) {
        renderTable(allProducts);
        updateChart(allProducts);
        calculatePrediction(allProducts);
        return;
      }
      
      const filteredData = allProducts.filter(item => 
        item.date.startsWith(year)
      );
      renderTable(filteredData);
      updateChart(filteredData);
      calculatePrediction(filteredData);
    }

    // 預測邏輯
    function calculatePrediction(data) {
      const predictionResult = document.getElementById('prediction-result');
      if (data.length === 0) {
        predictionResult.textContent = '尚無足夠數據進行分析。';
        return;
      }

      // 取得最新的一筆資料
      const latestItem = [...data].sort((a, b) => new Date(b.date) - new Date(a.date))[0];
      const currentPrice = parseFloat(latestItem.price);
      
      // 根據報導提到的兩種漲幅進行模擬
      const predictHigh = (currentPrice * 1.47).toFixed(2); // 47% 漲幅
      const predictStandard = (currentPrice * 1.25).toFixed(2); // 25% 漲幅

      predictionResult.innerHTML = `
        基於當前最新價格 (<strong>$${currentPrice}</strong>)，若參考報導漲幅：<br>
        - 若比照最高漲幅 (47%)，預計將達到：<span style="color: red;">$${predictHigh}</span><br>
        - 若比照麥香(480ml)漲幅 (25%)，預計將達到：<span style="color: orange;">$${predictStandard}</span>
      `;
    }

    // 更新圖表的函式
    function updateChart(data) {
      const ctx = document.getElementById('priceChart').getContext('2d');
      
      // 按日期排序資料
      const sortedData = [...data].sort((a, b) => new Date(a.date) - new Date(b.date));
      
      const labels = sortedData.map(item => item.date);
      const prices = sortedData.map(item => item.price);

      if (priceChart) {
        priceChart.destroy();
      }

      priceChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '產品價格',
            data: prices,
            borderColor: 'rgba(75, 192, 192, 1)',
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            borderWidth: 2,
            tension: 0.1,
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: false
            }
          }
        }
      });
    }

    // 頁面載入時執行
    loadProducts();

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const params = new URLSearchParams(formData).toString();
      const messageElement = document.getElementById('response-message');

      try {
        const response = await fetch(`/api/insert?${params}`);
        const data = await response.json();

        // 顯示伺服器回傳的訊息
        messageElement.textContent = data.message || data.msg || JSON.stringify(data);
        
        // 成功後重新載入表格
        if (response.ok) {
          loadProducts();
        }
      } catch (error) {
        console.error('Error:', error);
        messageElement.textContent = '發生錯誤，請稍後再試。';
      }
    });
  </script>
</body>

</html>
